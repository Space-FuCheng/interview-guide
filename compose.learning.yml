name: interview-guide-learning

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-interview_guide}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.2
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${APP_STORAGE_ACCESS_KEY:?Configure APP_STORAGE_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${APP_STORAGE_SECRET_KEY:?Configure APP_STORAGE_SECRET_KEY in .env}
      RUSTFS_RPC_SECRET: ${RUSTFS_RPC_SECRET:?Configure RUSTFS_RPC_SECRET in .env}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "--fail", "--silent", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
